[package]
name = "tru_id_core"
version = "0.1.0"
edition = "2021"
authors = ["istamar rozid<istamar.nugraha@gmail.co.id>"]
description = "tru_id_core — TRU Language (.tru) core: lexer, parser, interpreter, compiler, and high-performance runtime"
keywords = ["tru", "language", "compiler", "interpreter", "ai"]
categories = ["compilers", "science", "development-tools"]
publish = ["crates-io"]
repository = "https://artifactory.server.co.id/repository/cargo-rustc/"
license = "MIT"

[dependencies]
# Core dependencies
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.133"
serde_derive = "1.0.216"
chrono = { version = "0.4.31", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0.95"
log = "0.4"
lazy_static = "1.4.0"

# Database dependencies
surrealdb = "2.1.4"
diesel = { version = "1.4.5", features = ["postgres"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8.5", features = ["runtime-tokio-rustls", "postgres", "mysql", "sqlite", "time", "macros"] }
redis = "0.24.0"

# Security dependencies
aes-gcm = "0.10.3"
aes = "0.8.4"
base64 = "0.22.0"
sha2 = "0.10.8"
hex = "0.4.3"
jsonwebtoken = "9.2.0"
rand = "0.8"

# Web framework dependencies
warp = "0.3.7"
axum = "0.7.7"
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread", "full"] }
tower-http = { version = "0.5.0", features = ["cors"] }

# AI/ML dependencies
burn = { version = "0.16", features = ["std", "wgpu", "autodiff", "ndarray"], default-features = false }
burn-tensor = "0.16.0"
cubecl = "0.4.0"
ndarray = "0.15"
ndarray-rand = "0.14"

# Additional utilities
dotenv = "0.15"
once_cell = "1.21.4"
toml = "0.8.19"
rayon = "1.10.0"
bincode = "1.3.3"

# Windows registry (installer)
[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"

[features]
default = ["std"]
std = []

[lib]
name = "tru_id_core"
path = "src/lib.rs"

[[bin]]
name = "tru_id"
path = "src/bin/main.rs"

[[bin]]
name = "tru_id_installer"
path = "src/bin/installer.rs"
